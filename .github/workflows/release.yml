# Release builds (macOS Intel / Apple Silicon / Windows x64)

name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Compute release tag
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="build-${short_sha}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Ensure prerelease exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "YaYa ${{ steps.meta.outputs.short_sha }}" \
            --notes "Automated build from commit ${{ github.sha }} on branch ${{ github.ref_name }}." \
            --prerelease

  publish:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: mac-apple
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            name: mac-intel
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            name: win64
            # NSIS → YaYa_*_x64-setup.exe；跳过易因中文/编码翻车的 MSI
            args: --bundles nsis
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    name: build-${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: YaYa ${{ needs.prepare-release.outputs.short_sha }}
          releaseBody: |
            Automated build from commit ${{ github.sha }}.

            Platforms in this release (as jobs finish):
            - macOS Apple Silicon (`aarch64-apple-darwin`)
            - macOS Intel (`x86_64-apple-darwin`)
            - Windows x64: NSIS installer (`*-setup.exe`) + portable `YaYa-portable-win64.exe`

            Branch: `${{ github.ref_name }}`
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

      - name: Upload portable Windows exe
        if: matrix.name == 'win64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "src-tauri/target/release/yaya.exe" "YaYa-portable-win64.exe"
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            "YaYa-portable-win64.exe" \
            --clobber \
            --repo "${{ github.repository }}"
