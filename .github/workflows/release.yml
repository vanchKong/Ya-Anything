# 自动创建 GitHub 发行版（Releases），并上传 macOS / Windows 安装包
# 注意：这是「发行版 Releases」，不是仅 Tags

name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先创建正式发行版（会出现在仓库右侧「发行版 / 最新」）
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Compute release tag
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="build-${short_sha}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: YaYa ${{ steps.meta.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          # 正式发行版：会出现在仓库右侧「发行版」并带「最新」
          # （prerelease 只会进预发布，侧边栏通常不显示为「最新」）
          prerelease: false
          draft: false
          generate_release_notes: true
          body: |
            自动构建自提交 `${{ github.sha }}`（分支 `${{ github.ref_name }}`）。

            构建完成后会附带：
            - macOS Apple Silicon
            - macOS Intel
            - Windows x64（NSIS 安装包 + 便携 exe）

  publish:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: mac-apple
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            name: mac-intel
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            name: win64
            args: --bundles nsis
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    name: build-${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload assets to Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: YaYa ${{ needs.prepare-release.outputs.short_sha }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload portable Windows exe
        if: matrix.name == 'win64'
        shell: bash
        run: cp "src-tauri/target/release/yaya.exe" "YaYa-portable-win64.exe"

      - name: Attach portable Windows exe to Release
        if: matrix.name == 'win64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: YaYa-portable-win64.exe
          fail_on_unmatched_files: true
